<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Buffalo Claw Co. email signature (Ken)</title>
<!--
  Gmail signature for ken@bfloclaw.com.
  Open this file in a browser, click "Copy signature", then paste into
  Gmail > Settings > See all settings > General > Signature with plain
  Ctrl+V (NOT Ctrl+Shift+V, which strips formatting).
  The button copies the rendered signature as rich HTML so Gmail keeps
  the logo, colors, and layout.
-->
<style>
  body { margin: 0; padding: 28px; background: #f2f5f9; font-family: Arial, Helvetica, sans-serif; }
  .note { max-width: 560px; margin: 0 0 14px 0; color: #45596F; font-size: 14px; line-height: 1.5; }
  .sigwrap { background: #ffffff; border: 1px solid #d6dee8; border-radius: 10px; padding: 22px; max-width: 560px; }
  #copybtn { margin-top: 14px; background: #16385E; color: #ffffff; border: none; border-radius: 8px;
             padding: 12px 22px; font-size: 15px; font-weight: bold; cursor: pointer; }
  #copybtn:hover { background: #0f2a49; }
  #status { margin-left: 10px; font-size: 14px; color: #1a7f37; font-weight: bold; }
</style>
</head>
<body>

<div class="note"><strong>1.</strong> Click the button below. <strong>2.</strong> In Gmail: Settings &gt; See all settings &gt; General &gt; Signature &gt; Create new. <strong>3.</strong> Paste with plain <strong>Ctrl+V</strong> (not Ctrl+Shift+V). <strong>4.</strong> Save changes at the bottom.</div>

<div class="sigwrap">
<!-- signature start -->
<table id="signature" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; border-collapse:collapse;">
  <tr>
    <td style="padding:0 16px 0 0; vertical-align:middle;">
      <a href="https://buffaloclawmachines.com/" target="_blank" style="text-decoration:none; border:0;">
        <img src="https://buffaloclawmachines.com/assets/bcc-logo.png" alt="Buffalo Claw Co." width="72" height="72" style="display:block; border:0; width:72px; height:72px;">
      </a>
    </td>
    <td style="border-left:2px solid #16385E; padding:2px 0 2px 16px; vertical-align:middle;">
      <div style="font-size:16px; line-height:1.3; font-weight:bold; color:#16385E;">Ken Milligan</div>
      <div style="font-size:13px; line-height:1.4; color:#45596F; padding-bottom:6px;">Owner, Buffalo Claw Co.</div>
      <div style="font-size:13px; line-height:1.5; color:#45596F;">
        716-472-1689&nbsp;&nbsp;|&nbsp;&nbsp;<a href="mailto:ken@bfloclaw.com" style="color:#45596F; text-decoration:none;">ken@bfloclaw.com</a>
      </div>
      <div style="font-size:13px; line-height:1.5;">
        <a href="https://buffaloclawmachines.com/" target="_blank" style="color:#16385E; font-weight:bold; text-decoration:none;">buffaloclawmachines.com</a>
      </div>
    </td>
  </tr>
</table>
<!-- signature end -->
</div>

<button id="copybtn">Copy signature</button><span id="status"></span>

<script>
document.getElementById("copybtn").addEventListener("click", async function () {
  var sig = document.getElementById("signature");
  var status = document.getElementById("status");
  var html = sig.outerHTML;
  var text = "Ken Milligan\nOwner, Buffalo Claw Co.\n716-472-1689 | ken@bfloclaw.com\nbuffaloclawmachines.com";
  var ok = false;

  // Preferred: async clipboard with an explicit text/html flavor.
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" })
      })]);
      ok = true;
    } catch (e) { /* fall through */ }
  }

  // Fallback: select the rendered node and copy the selection.
  if (!ok) {
    var range = document.createRange();
    range.selectNode(sig);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ok = document.execCommand("copy");
    sel.removeAllRanges();
  }

  status.textContent = ok ? "Copied! Paste into Gmail with Ctrl+V." : "Copy failed - select the signature manually and press Ctrl+C.";
  status.style.color = ok ? "#1a7f37" : "#b42318";
});
</script>

</body>
</html>
